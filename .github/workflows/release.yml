name: Release

# Cuts a release for every push to main that contains bump-worthy conventional
# commits (squash-merge PR titles): feat -> minor, fix/improvement -> patch,
# "type!:" or a BREAKING CHANGE footer -> major. Everything else (chore, docs,
# refactor, perf, ci, test, build, revert) does not bump: the run skips
# cleanly and the code still ships via fly_production.yml, which is fully
# decoupled from tagging. The version lives ONLY in the tag - no bump commit,
# no CHANGELOG, nothing is ever pushed back to main, so develop and main can
# no longer diverge.
#
# Tag + release notes happen in this one workflow, so we deliberately use the
# default GITHUB_TOKEN: the tag it creates triggers no other workflows, and
# nothing listens on v* tags anymore.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force-bump:
        description: "Cut a release even without bump-worthy commits"
        type: choice
        options: [patch, minor, major]
        required: true

permissions:
  contents: write

# Serialize releases so two rapid merges to main can't compute the same next
# version: the queued run re-fetches tags and starts from the tag the first
# run just created. If a duplicate ever slipped through anyway, `gh release
# create` fails loudly on the existing tag instead of clobbering it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag + release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: a fast-forward push can carry many
          # squash-merged PRs, and the bump scans everything since the
          # last v* tag.
          fetch-depth: 0

      - name: Compute next version from conventional commits
        id: version
        env:
          FORCE_BUMP: ${{ inputs.force-bump }}
        run: |
          set -euo pipefail

          # Tags created while this run sat in the concurrency queue must be
          # visible before picking a base.
          git fetch --tags --force --quiet origin

          # Nearest v* tag reachable from the pushed commit (topological, so
          # v3.9.x vs v3.10.x lexical-sort traps don't apply). --tags because
          # release tags are lightweight from now on.
          last_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_SHA}")"

          if [[ ! "${last_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected last tag '${last_tag}' (want vX.Y.Z). Refusing to guess."
            exit 1
          fi

          # Buffered into variables (not piped into grep -q) so pipefail
          # can't misread a SIGPIPE'd git log as "no match".
          subjects="$(git log --format='%s' "${last_tag}..${GITHUB_SHA}")"
          bodies="$(git log --format='%b' "${last_tag}..${GITHUB_SHA}")"

          # Exact port of the git_ops semantics this repo used. Squash-merge
          # bodies are "* <commit subject>" bullets, hence the optional "* "
          # prefix on the BREAKING CHANGE footer match.
          bump=""
          if grep -qE '^[a-z]+(\([^)]*\))?!: ' <<<"${subjects}" \
             || grep -qE '^(\* )?BREAKING[- ]CHANGE: ' <<<"${bodies}"; then
            bump="major"
          elif grep -qE '^feat(\([^)]*\))?: ' <<<"${subjects}"; then
            bump="minor"
          elif grep -qE '^(fix|improvement)(\([^)]*\))?: ' <<<"${subjects}"; then
            bump="patch"
          fi

          if [[ -n "${FORCE_BUMP:-}" ]]; then
            bump="${FORCE_BUMP}"
            echo "Forced bump: ${bump}"
          fi

          if [[ -z "${bump}" ]]; then
            echo "No bump-worthy commits since ${last_tag} - skipping the release (the code still deploys)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r major minor patch <<<"${last_tag#v}"
          case "${bump}" in
            major) next_tag="v$((major + 1)).0.0" ;;
            minor) next_tag="v${major}.$((minor + 1)).0" ;;
            patch) next_tag="v${major}.${minor}.$((patch + 1))" ;;
          esac

          echo "Releasing ${next_tag} (${bump} bump from ${last_tag})" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "release=true"
            echo "last_tag=${last_tag}"
            echo "next_tag=${next_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.next_tag }}" \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.version.outputs.next_tag }}" \
            --generate-notes \
            --notes-start-tag "${{ steps.version.outputs.last_tag }}"
