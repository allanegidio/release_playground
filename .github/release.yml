# Configuration for auto-generated release notes
# See: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - release
      - ignore-for-release
      - dependencies
      - skip-changelog
    authors:
      - dependabot
      - github-actions[bot]
  categories:
    - title: ⚠️ Breaking Changes
      labels:
        - breaking-change
    - title: 🚀 New Features
      labels:
        - feature
        - enhancement
        - new
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - bugfix
        - fix
        - hotfix
    - title: 📚 Documentation
      labels:
        - documentation
        - docs
    - title: 🔧 Maintenance
      labels:
        - maintenance
        - chore
        - refactor
    - title: 🎨 UI/UX Improvements
      labels:
        - ui
        - ux
        - design
    - title: ⚡ Performance
      labels:
        - performance
        - optimization
    - title: 🔒 Security
      labels:
        - security
    - title: 🧪 Tests
      labels:
        - test
        - testing
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
